name: Kontrola a GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Kontrola projektu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Nahrát sestavení pro Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.has_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Nasazení na GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.has_pages
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ověřit nastavení Pages
        uses: actions/configure-pages@v5
      - name: Nasadit sestavení
        id: deployment
        uses: actions/deploy-pages@v4
