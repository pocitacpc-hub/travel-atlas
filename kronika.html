<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kronika · Cestovní atlas</title>
  <meta name="description" content="Kronika cest po letech s filtrem podle státu a hledáním.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="cs_CZ">
  <meta property="og:site_name" content="Cestovní atlas">
  <meta property="og:title" content="Kronika · Cestovní atlas">
  <meta property="og:description" content="Kronika cest po letech s filtrem podle státu a hledáním.">
  <meta property="og:image" content="/src/img/sdileni.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Skalnaté útesy nad oceánem s malou písečnou pláží">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f2eadb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/src/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/atlas.css">
  <script type="module" src="/src/pages/kronika.ts"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="./"><b>Cestovní atlas</b></a>
      <nav aria-label="Hlavní navigace">
        <a href="./"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5 9 4.5l6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg><span>Přehled</span></a>
        <a href="kronika.html" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5a2 2 0 0 1 2-2h12v14H7a2 2 0 0 0-2 2z"/><path d="M5 19.5a2 2 0 0 0 2 2h12v-4M9 8h6"/></svg><span>Kronika</span></a>
        <a href="statistiky.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20.5h16M7 17v-6M12 17V5.5M17 17V9"/></svg><span>Statistiky</span></a>
      </nav>
    </header>
    <main id="main">
      <noscript><p class="empty-note">Atlas zobrazuje data pomocí JavaScriptu. Zapněte ho prosím v prohlížeči.</p></noscript>
      <section class="page-head">
        <div>
          <p class="kicker" id="span"></p>
          <h1>Kronika cest</h1>
          <p id="lead"></p>
        </div>
        <div class="panel legendbox" aria-label="Legenda">
          <div class="row"><span><i class="lg-bar sw-cz"></i>Česko</span><span><i class="lg-bar sw-abroad"></i>zahraničí</span><span>délka pruhu = počet nocí</span></div>
          <div class="row"><span><i class="unkbar"></i>délka neznámá</span><span><i class="lg-bar lg-month"></i>přesné datum neznámé</span></div>
          <div class="row"><span class="new"><svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/></svg>nová země</span><span>první známá cesta do státu</span></div>
        </div>
      </section>

      <div class="panel toolbar" role="search">
        <div class="filters">
          <div class="seg" role="group" aria-label="Rozsah">
            <button type="button" data-scope="all" aria-pressed="true">Vše</button>
            <button type="button" data-scope="cz" aria-pressed="false">Česko</button>
            <button type="button" data-scope="abroad" aria-pressed="false">Zahraničí</button>
          </div>
          <label>Stát <select id="stat"></select></label>
          <div class="seg"><button type="button" id="onlyText" aria-pressed="false">Jen s popisem</button></div>
          <input type="search" id="q" placeholder="Hledat cestu…" aria-label="Hledat cestu">
        </div>
        <span class="note" id="count" aria-live="polite"></span>
      </div>

      <div class="layout">
        <nav class="rail" aria-label="Skok na rok"><ol id="rail"></ol></nav>
        <div id="timeline"></div>
      </div>
    </main>
  </div>
</body>
</html>
