# Veřejná shrnutí cest schválená Martinem 9. 11. 2026
- nazev: Norsko – Oslo
  rok: 2021
  potvrzeno: true
  zmeny:
    verejny_popis: |-
      Prodloužený víkend v **Oslu** ve znamení muzeí. Na poloostrově **Bygdøy** nás nejvíc bavilo *Norsk Folkemuseum*, *Námořní muzeum* a polární loď *Fram*, Kon-Tiki ušlo a vikingské lodě nás nezaujaly.

      Výborné bylo i *Technické muzeum* a výhled ze skokanského můstku na **Holmenkollenu**. K tomu pevnost **Akershus**, opera a **Vigelandův park**.
- nazev: Mallorca – Palma a okolí
  rok: 2024
  potvrzeno: true
  zmeny:
    verejny_popis: Mezi svátky na **Mallorce** se základnou v **Palmě**. Jeden den v horách u **Sólleru**, druhý ve **Valldemosse**, k tomu túra u **Deià**. Za čtyři dny jsme ušli přes *50 km*.
- nazev: Portugalsko – Porto, Sintra a Lisabon
  rok: 2023
  potvrzeno: true
  zmeny:
    verejny_popis: Týden v Portugalsku od severu k jihu. Nejdřív **Porto**, pak romantická **Sintra** a nakonec **Lisabon**. Hodně jsme chodili pěšky, v Sintře a Lisabonu i na delší okruhy.
- nazev: Slovinsko – Piran, Izola a Bled
  rok: 2026
  potvrzeno: true
  zmeny:
    verejny_popis: Jarní roadtrip do **Slovinska**, cestou túra u rakouského **Badenu**. Na pobřeží **Piran**, **Izola** a **Koper** s procházkami a během podél moře, pak túra kolem **Bledu** a v okolí **Gorje**.
- nazev: Polsko – Jastrzębia Góra a Baltské pobřeží
  rok: 2026
