    verejny_popis: |-
      Tři noci v **Dublinu**. Hlavní atrakcí byl **Guinness Storehouse**.

      - **Centrum:** *Grafton Street*, *Temple Bar*, park *St Stephen's Green* a **Trinity College** s knihovnou a *Book of Kells*.
      - **Kolem řeky Liffey:** mosty *Samuel Beckett Bridge* a *Ha'penny Bridge*, *Spire of Dublin* a nákupy v *Ilac Centre*.
      - **Phoenix Park:** výlet do parku a do **Dublin Zoo**.
- nazev: Velká Británie – Londýn
  rok: 2019
  potvrzeno: true
  zmeny:
    verejny_popis: |-
      Pět lednových nocí v **Londýně**.

      - **Muzea a parky:** *Madame Tussauds*, **Hyde Park**, *Science Museum* a trhy v **Camden Town**.
      - **Greenwich a fotbal:** *National Maritime Museum* v **Greenwichi**, poté zápas **Watford – Burnley** na stadionu *Vicarage Road* ve **Watfordu**.
      - **Centrum:** *British Museum*, **Covent Garden**, **Soho** a **Chinatown**, hračkářství *Hamleys*. Večer **Trafalgar Square**, **Buckinghamský palác**, *Westminster Abbey*, parlament a **Big Ben**.
      - **Podél Temže:** *SEA LIFE London*, **London Bridge**, **Tower Bridge** a stará hospoda *Ye Olde Mitre*.
