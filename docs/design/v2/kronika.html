<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kronika · Cestovní stopa</title>
<link rel="stylesheet" href="assets/atlas.css">
<style>
:root { --unit: 15px; }
.legendbox { display: grid; gap: 8px; padding: 14px 16px; font-size: 13px; }
.legendbox .row { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; color: var(--ink-2); }
.new { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--ink); border-radius: 999px; padding: 0 7px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.new svg { width: 10px; height: 10px; }
.unkbar { display: inline-block; width: 30px; height: 10px; border: 1.5px dashed var(--muted); border-radius: 0 5px 5px 0; vertical-align: 0; margin-right: 6px; }
.toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; margin-bottom: 8px; }
.layout { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 32px; }
.rail { position: sticky; top: 16px; align-self: start; max-height: calc(100vh - 32px); overflow: auto; padding: 8px 4px 8px 0; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail a { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 8px; text-decoration: none; font-size: 12px; color: var(--muted); padding: 1px 0; min-height: 18px; font-variant-numeric: tabular-nums; }
.rail a:hover, .rail a.is-active { color: var(--ink); }
.rail a.is-active { font-weight: 700; }
.rail .b { display: flex; height: 8px; gap: 1px; }
.rail .b i { display: block; height: 8px; border-radius: 2px; }
.rail li.dec { margin-top: 6px; }
.year { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 24px; padding: 18px 0; border-top: 1px solid var(--line); }
.year.empty { padding: 8px 0; }
.year .yy { font: 400 44px/1 var(--serif); display: block; }
.year.empty .yy { font-size: 22px; color: var(--muted); }
.year .ysum { font-size: 13px; color: var(--muted); display: block; margin-top: 6px; }
.trips { list-style: none; margin: 0; padding: 4px 0 0; display: grid; gap: 4px; }
.trip a { display: grid; grid-template-columns: 34px calc(var(--unit) * 13 + 2px) minmax(0, 1fr); gap: 12px; align-items: center; text-decoration: none; padding: 4px 6px; border-radius: 10px; }
.trip a:hover { background: var(--card); }
.trip a:hover .t { text-decoration: underline; }
.trip .m { font-size: 12px; color: var(--muted); text-align: right; }
.trip .bar { height: 12px; border-radius: 0 6px 6px 0; min-width: 6px; }
.trip .bar.unk { background: transparent !important; border: 1.5px dashed var(--muted); width: 46px; }
.trip .bar.month { opacity: .55; }
.trip .txt { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.trip .t { font-weight: 600; }
.trip .meta { font-size: 13px; color: var(--muted); }
.empty-state { padding: 40px 0; color: var(--muted); }
@media (max-width: 820px) {
  :root { --unit: 9px; }
  .layout { grid-template-columns: 1fr; gap: 0; }
  .rail { position: sticky; top: 0; z-index: 3; background: var(--paper); max-height: none; overflow-x: auto; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .rail ol { display: flex; gap: 4px; }
  .rail li.dec { margin-top: 0; }
  .rail a { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; min-height: 36px; background: var(--card); white-space: nowrap; }
  .rail .b { display: none; }
  .year { grid-template-columns: 1fr; gap: 6px; }
  .year .yy { font-size: 32px; display: inline; margin-right: 10px; }
  .year .ysum { display: inline; }
  .trip a { grid-template-columns: 30px calc(var(--unit) * 13 + 2px) minmax(0, 1fr); gap: 8px; padding: 4px 0; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/></symbol>
</svg>
<div class="wrap">
  <header id="top"></header>
  <main>
    <section class="page-head">
      <div>
        <p class="kicker" id="span"></p>
        <h1>Kronika cest</h1>
        <p id="lead"></p>
      </div>
      <div class="panel legendbox" aria-label="Legenda">
        <div class="row"><span><i class="bar" style="display:inline-block;width:56px;height:10px;border-radius:0 5px 5px 0;background:var(--cz);margin-right:6px"></i>Česko</span><span><i style="display:inline-block;width:56px;height:10px;border-radius:0 5px 5px 0;background:var(--abroad);margin-right:6px"></i>zahraničí</span><span>délka pruhu = počet nocí</span></div>
        <div class="row"><span><i class="unkbar"></i>délka neznámá</span><span><i style="display:inline-block;width:30px;height:10px;border-radius:0 5px 5px 0;background:var(--ink-2);opacity:.55;margin-right:6px"></i>přesné datum neznámé</span></div>
        <div class="row"><span class="new"><svg aria-hidden="true"><use href="#i-star"/></svg>nová země</span><span>první známá cesta do státu</span></div>
      </div>
    </section>

    <div class="panel toolbar" role="search">
      <div class="filters">
        <div class="seg" role="group" aria-label="Rozsah">
          <button type="button" data-scope="all" aria-pressed="true">Vše</button>
          <button type="button" data-scope="cz" aria-pressed="false">Česko</button>
          <button type="button" data-scope="abroad" aria-pressed="false">Zahraničí</button>
        </div>
        <label>Stát <select id="stat"></select></label>
        <input type="search" id="q" placeholder="Hledat cestu…" aria-label="Hledat cestu">
      </div>
      <span class="note" id="count" aria-live="polite"></span>
    </div>

    <div class="layout">
      <nav class="rail" aria-label="Skok na rok"><ol id="rail"></ol></nav>
      <div id="timeline"></div>
    </div>
  </main>
  <footer id="foot"></footer>
</div>

<script src="../assets/data.js"></script>
<script src="../assets/europe-map.js"></script>
<script src="../assets/viz.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  APP.shell('Kronika');
  var F = VZ.fmt, all = VZ.data.trips, base = VZ.stats(all), $ = function (id) { return document.getElementById(id); };
  var st = { scope: 'all', stat: base.countries.some(function (c) { return c.code === APP.param('stat'); }) ? APP.param('stat') : '', q: '' };

  $('span').textContent = base.minYear + '–' + base.maxYear;
  $('stat').innerHTML = '<option value="">všechny</option>' + base.countries.map(function (c) { return '<option value="' + c.code + '">' + c.name + ' (' + c.count + ')</option>'; }).join('');
  $('stat').value = st.stat;

  function tripLi(t) {
    var isNew = base.firstTripOfCountry[t.id];
    var col = t.zeme === 'CZ' ? 'var(--cz)' : 'var(--abroad)';
    var w = t.noci === null ? '' : 'width:calc(var(--unit) * ' + t.noci + ');';
    var m = t.mesic ? VZ.MONTHS_SHORT[t.mesic - 1] : '?';
    return '<li class="trip"><a href="' + APP.tripUrl(t) + '"><span class="m" title="' + (t.mesic ? VZ.MONTHS[t.mesic - 1] : 'měsíc neznámý') + '">' + m + '</span>' +
      '<span class="bar' + (t.noci === null ? ' unk' : t.presnost !== 'den' ? ' month' : '') + '" style="' + w + 'background:' + col + '" aria-hidden="true"></span>' +
      '<span class="txt"><span class="t">' + F.esc(F.short(t)) + '</span>' +
      '<span class="meta">' + VZ.NAMES[t.zeme] + ' · ' + (t.presnost === 'den' ? F.termin(t) + ' · ' : '') + F.noci(t.noci) + (t.sport ? ' · ' + F.num(t.sport.km, 0) + ' km aktivit' : '') + '</span>' +
      (isNew ? '<span class="new"><svg aria-hidden="true"><use href="#i-star"/></svg>nová země: ' + VZ.NAMES[isNew] + '</span>' : '') + '</span></a></li>';
  }

  var io = null;
  function render() {
    var trips = all.filter(function (t) {
      if (st.scope === 'cz' && t.zeme !== 'CZ') return false;
      if (st.scope === 'abroad' && t.zeme === 'CZ') return false;
      if (st.stat && t.zeme !== st.stat) return false;
      if (st.q && t.nazev.toLowerCase().indexOf(st.q) < 0) return false;
      return true;
    });
    var filtered = st.scope !== 'all' || st.stat || st.q;
    $('count').textContent = filtered ? 'Zobrazeno ' + F.cesty(trips.length) + ' z ' + base.total : F.cesty(base.total) + ' v archivu';
    if (!trips.length) { $('timeline').innerHTML = '<p class="empty-state">Filtrům neodpovídá žádná cesta.</p>'; $('rail').innerHTML = ''; return; }
    var s = VZ.stats(trips);
    $('lead').innerHTML = F.cesty(s.total) + (st.stat ? ' do státu ' + VZ.NAMES[st.stat] : '') + ', ' + F.num(s.nightsSum) + ' známých nocí (u ' + s.nightsKnown + ' z ' + s.total + ' cest).' +
      (s.undated ? ' ' + F.cesty(s.undated) + ' bez známého roku je na konci.' : '');

    // řádky let: bez filtru i prázdné roky celého archivu, s filtrem jen roky s cestou
    var byYear = {};
    s.years.forEach(function (y) { byYear[y.year] = y; });
    var years = [];
    for (var y = base.maxYear; y >= base.minYear; y--) {
      var row = byYear[y] || { year: y, total: 0, cz: 0, abroad: 0, trips: [], nights: 0, nightsKnown: 0 };
      if (row.total || !filtered) years.push(row);
    }
    var html = years.map(function (y) {
      if (!y.total) return '<section class="year empty" id="y' + y.year + '"><div><span class="yy">' + y.year + '</span></div><div><span class="ysum">bez záznamu v archivu</span></div></section>';
      return '<section class="year" id="y' + y.year + '"><div><span class="yy">' + y.year + '</span><span class="ysum">' + F.cesty(y.total) +
        (y.abroad && y.cz ? ' · ' + y.abroad + ' do zahraničí' : '') + '<br>' + (y.nightsKnown ? F.noci(y.nights) + (y.nightsKnown < y.total ? ' (známo u ' + y.nightsKnown + ')' : '') : 'noci neznámé') + '</span></div>' +
        '<ol class="trips">' + y.trips.map(tripLi).join('') + '</ol></section>';
    }).join('');
    if (s.undated) html += '<section class="year" id="yunk"><div><span class="yy">?</span><span class="ysum">rok neznámý<br>' + F.cesty(s.undated) + '</span></div>' +
      '<div><ol class="trips">' + s.undatedTrips.map(tripLi).join('') + '</ol><p class="note">Cesty jsou doložené, ale rok neznáme. Počítají se do států, ne do let.</p></div></section>';
    $('timeline').innerHTML = html;

    $('rail').innerHTML = years.map(function (y) {
      var b = '<span class="b" aria-hidden="true">' + (y.cz ? '<i style="width:' + y.cz * 6 + 'px;background:var(--cz)"></i>' : '') + (y.abroad ? '<i style="width:' + y.abroad * 6 + 'px;background:var(--abroad)"></i>' : '') + '</span>';
      return '<li' + (y.year % 10 === 9 ? ' class="dec"' : '') + '><a href="#y' + y.year + '" aria-label="' + y.year + ', ' + F.cesty(y.total) + '">' + y.year + b + '</a></li>';
    }).join('') + (s.undated ? '<li class="dec"><a href="#yunk">?</a></li>' : '');

    var links = {};
    document.querySelectorAll('.rail a').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
    if (io) io.disconnect();
    io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        document.querySelectorAll('.rail a.is-active').forEach(function (a) { a.classList.remove('is-active'); });
        var a = links[e.target.id];
        if (a) { a.classList.add('is-active'); if (window.innerWidth <= 820) a.scrollIntoView({ block: 'nearest', inline: 'center' }); }
      });
    }, { rootMargin: '-10% 0px -80% 0px' });
    document.querySelectorAll('.year').forEach(function (sec) { io.observe(sec); });
  }

  document.querySelectorAll('[data-scope]').forEach(function (b) {
    b.addEventListener('click', function () {
      st.scope = b.dataset.scope;
      document.querySelectorAll('[data-scope]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
  });
  $('stat').addEventListener('change', function (e) {
    st.stat = e.target.value;
    history.replaceState(null, '', st.stat ? '?stat=' + st.stat : location.pathname);
    render();
  });
  $('q').addEventListener('input', function (e) { st.q = e.target.value.trim().toLowerCase(); render(); });
  render();
})();
</script>
</body>
</html>
