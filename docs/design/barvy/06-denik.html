<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">

  <title>Cestovní deník · barevný návrh · Cestovní atlas</title>

  <link rel="stylesheet" href="../v2/assets/flag-icons/flag-icons.css">
  <link rel="stylesheet" href="assets/zaklad.css">
  <style>
/* Cestovní deník: Zápisník z cest: krémový papír, inkoustová modrá, rezavé razítko a ručně psané poznámky.
   Písmo: Garamond + Segoe UI + Ink Free. */
:root {
  --paper: #F2EADB;
  --card: #FBF6EB;
  --ink: #2E2419;
  --ink-2: #4E4133;
  --muted: #6B5D4C;
  --line: #DCCDB4;
  --line-2: #E9DFCB;
  --land: #E7DCC6;
  --cz: #2D5C88;
  --cz-text: #2A5781;
  --abroad: #B5613A;
  --q1: #C9D5E2;
  --q2: #9AB2CB;
  --q3: #6288AE;
  --q4: #2D5C88;
  --q5: #1B3A57;
  --q-ink: #0E2235;
  --hover: rgba(46, 36, 25, .06);
  --track: #E8DECB;
  --grid: #E2D6C1;
  --grid-base: #BBAA8E;
  --accent: #A5532F;
  --stamp: #9A4A28;
  --kicker: #9A4A28;
  --serif: Garamond, "EB Garamond", "Sitka Text", Georgia, serif;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --brand-font: Garamond, Georgia, serif;
  --brand-weight: 400;
}
.brand b { font-size: 32px; }
.intro h1 { font-size: 60px; }
.facts dd { font-size: 30px; }
.card h3 { font-size: 24px; }
h2.sec { font-size: 32px; } .panel h2.sec { font-size: 27px; }
.kicker { font: 19px/1.3 "Ink Free", "Segoe Print", cursive; letter-spacing: 0; text-transform: none; }
.card .stamp { border: 2px solid var(--stamp); box-shadow: inset 0 0 0 2px var(--card), inset 0 0 0 3px var(--stamp); }
[data-foto="polaroid"] .foto figcaption { font: 14px/1.15 "Ink Free", "Segoe Print", cursive; }
  </style>
</head>
<body data-foto="polaroid" data-obr="1" data-pismo="Garamond + Segoe UI + Ink Free">

</body>
