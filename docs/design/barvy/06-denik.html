<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cestovní deník · barevný návrh · Cestovní atlas</title>
  <meta name="description" content="Zápisník z cest: krémový papír, inkoustová modrá, rezavé akcenty, ručně psaný nadtitulek a fotka jako polaroid.">
  <link rel="stylesheet" href="../v2/assets/flag-icons/flag-icons.css">
  <link rel="stylesheet" href="assets/zaklad.css">
  <style>
/* Cestovní deník: Zápisník z cest: krémový papír, inkoustová modrá, rezavé akcenty, ručně psaný nadtitulek a fotka jako polaroid.
   Písmo: Palatino + Segoe UI + Ink Free. */
:root {
  --paper: #F2EADB;
  --card: #FBF6EB;
  --ink: #2E2419;
  --ink-2: #4E4133;
  --muted: #6B5D4C;
  --line: #DCCDB4;
  --line-2: #E9DFCB;
  --land: #E7DCC6;
  --cz: #2D5C88;
  --cz-text: #2A5781;
  --abroad: #B5613A;
  --q1: #C9D5E2;
  --q2: #9AB2CB;
  --q3: #6288AE;
  --q4: #2D5C88;
  --q5: #1B3A57;
  --q-ink: #08182A;
  --hover: rgba(46, 36, 25, .06);
  --track: #E8DECB;
  --grid: #E2D6C1;
  --grid-base: #BBAA8E;
  --accent: #A5532F;
  --kicker: #9A4A28;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, serif;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
}
.intro h1 { font-size: 56px; }
.kicker { font: 19px/1.3 "Ink Free", "Segoe Print", cursive; letter-spacing: 0; text-transform: none; }
/* fotka bez popisku */
.foto figcaption { display: none; }
[data-foto="polaroid"] .foto { padding-bottom: 24px; }
/* vlajky pod fotkou přes celou šířku sloupce */
.flagrow { clear: both; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.flagrow button { display: grid; place-items: center; }
/* karty posledních cest: vlajka vpravo nahoře místo razítka s kódem */
.card .stamp { display: none; }
.card .cty .fi { position: absolute; top: 18px; right: 18px; margin: 0; font-size: 26px; }
  </style>
</head>
<body data-foto="polaroid" data-obr="1" data-pismo="Palatino + Segoe UI + Ink Free">
  <script src="assets/prehled.js"></script>
</body>
</html>
