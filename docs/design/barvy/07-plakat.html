<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cestovní plakát · barevný návrh · Cestovní atlas</title>
  <meta name="description" content="Retro plakát: syté barvy, tlustá kontura, verzálky a výrazné slunečné žluté akcenty.">
  <link rel="stylesheet" href="../v2/assets/flag-icons/flag-icons.css">
  <link rel="stylesheet" href="assets/zaklad.css">
  <style>
/* Cestovní plakát: Retro plakát: syté barvy, tlustá kontura, verzálky a výrazné slunečné žluté akcenty.
   Písmo: Gill Sans MT. */
:root {
  --paper: #F5EEDF;
  --card: #FFFAF0;
  --ink: #1A2238;
  --ink-2: #39415A;
  --muted: #565D70;
  --line: #DCCFB6;
  --line-2: #EAE1CF;
  --land: #E9E0CC;
  --cz: #1E5FA8;
  --cz-text: #1B5596;
  --abroad: #D45A22;
  --q1: #C5D7EE;
  --q2: #8FB3E0;
  --q3: #4F86C6;
  --q4: #1E5FA8;
  --q5: #123D70;
  --q-ink: #0A2242;
  --hover: rgba(26, 34, 56, .07);
  --track: #EAE1CF;
  --grid: #E3D8C2;
  --grid-base: #B3A588;
  --accent: #D45A22;
  --nav-on-bg: #F2B33D;
  --nav-on-fg: #1A2238;
  --nav-fg: #EDE6D6;
  --stamp: var(--ink);
  --serif: "Gill Sans MT", "Gill Sans", "Segoe UI", sans-serif;
  --sans: "Gill Sans MT", "Gill Sans", "Segoe UI", sans-serif;
  --brand-font: "Gill Sans MT", "Gill Sans", sans-serif;
  --brand-style: normal;
  --brand-weight: 700;
  --h-weight: 700;
  --h-case: uppercase;
  --h-track: .01em;
  --bw: 2px;
  --r-panel: 4px;
  --r-card: 4px;
  --r-pill: 4px;
  --r-code: 2px;
  --shadow: 5px 5px 0 var(--ink);
  --shadow-hover: 7px 7px 0 var(--ink);
  --foto-r: 4px;
  --foto-filter: saturate(1.15) contrast(1.05);
  --foto-pos: 50% 28%;
  --foto-h: 240px;
}
body { font-size: 16px; }
.top { margin: 0 -28px; padding: 18px 28px; background: var(--ink); border-bottom: 0; }
.brand b { color: #F2B33D; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; }
.brand span { color: #C9C3B5; }
.panel, .card { border-color: var(--ink); }
.facts, .facts div { border-color: var(--ink); }
.intro h1 { font-size: 54px; line-height: 1; }
.intro h1 em { font-style: normal; }
.card h3 { font-size: 19px; line-height: 1.15; }
.card .stamp { border: 0; background: #F2B33D; color: var(--ink); transform: rotate(-8deg); }
[data-foto="pruh"] .foto { border: 2px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); margin-right: 5px; }
@media (max-width: 760px) { .top { margin: 0 -16px; padding: 14px 16px; } }
  </style>
</head>
<body data-foto="pruh" data-obr="2" data-pismo="Gill Sans MT">
  <script src="assets/prehled.js"></script>
</body>
</html>
