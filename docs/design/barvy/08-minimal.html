/* Čistý minimal: Bílé plochy, jedno písmo bez patek, kobaltová a oranžová, jemné stíny místo papíru.
   Písmo: Segoe UI Variable. */
:root {
  --paper: #F3F4F6;
  --card: #FFFFFF;
  --ink: #111418;
  --ink-2: #3B4249;
  --muted: #5E6670;
  --line: #E0E3E7;
  --line-2: #ECEEF1;
  --land: #E5E8EC;
  --cz: #2A58C2;
  --cz-text: #2450B3;
  --abroad: #DE6410;
  --q1: #D2DDF6;
  --q2: #A3BAEC;
  --q3: #6A8EDC;
  --q4: #2A58C2;
  --q5: #183888;
  --q-ink: #0B1D4D;
  --hover: rgba(17, 20, 24, .05);
  --track: #ECEEF1;
  --grid: #ECEEF1;
  --grid-base: #C5CAD1;
  --serif: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --brand-font: "Segoe UI Variable Display", "Segoe UI", sans-serif;
  --brand-style: normal;
  --brand-weight: 700;
  --h-weight: 600;
  --h-track: -1.2px;
  --r-panel: 12px;
  --r-card: 12px;
  --r-pill: 10px;
  --foto-r: 12px;
  --shadow: 0 1px 2px rgba(17, 20, 24, .05);
  --shadow-hover: 0 4px 14px rgba(17, 20, 24, .08);
}
.brand b { font-size: 22px; letter-spacing: -.3px; }
.intro h1 em { font-style: normal; }
.facts dd { font-weight: 600; letter-spacing: -.5px; }
.card .stamp { width: auto; height: auto; padding: 2px 8px; border: 0; border-radius: 6px; background: var(--line-2); color: var(--ink-2); font-size: 12px; transform: none; }
