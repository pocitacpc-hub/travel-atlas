<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Námořní mapa · barevný návrh · Cestovní atlas</title>
  <meta name="description" content="Navigační mapa: modrobílé moře, okrová pevnina, signální oranžová a technické písmo.">
  <link rel="stylesheet" href="../v2/assets/flag-icons/flag-icons.css">
  <link rel="stylesheet" href="assets/zaklad.css">
  <style>
/* Námořní mapa: Navigační mapa: modrobílé moře, okrová pevnina, signální oranžová a technické písmo.
   Písmo: Bahnschrift + Segoe UI Variable. */
:root {
  --paper: #EDF2F3;
  --card: #F6FAFB;
  --ink: #13263A;
  --ink-2: #34495C;
  --muted: #526678;
  --line: #C9D6DC;
  --line-2: #DCE6EA;
  --land: #EBE3C9;
  --cz: #2A6CA3;
  --cz-text: #245F90;
  --abroad: #D2611C;
  --q1: #C3D9EA;
  --q2: #8FBBDB;
  --q3: #5594C4;
  --q4: #2A6CA3;
  --q5: #163F66;
  --q-ink: #0B2236;
  --hover: rgba(19, 38, 58, .06);
  --track: #DFE8EC;
  --grid: #D7E2E7;
  --grid-base: #A9BBC5;
  --accent: #C2561A;
  --kicker: var(--cz-text);
  --serif: Bahnschrift, "DIN Alternate", "Segoe UI", sans-serif;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --brand-font: Bahnschrift, "Segoe UI", sans-serif;
  --brand-style: normal;
  --brand-weight: 600;
  --h-track: 0px;
  --r-panel: 6px;
  --r-card: 6px;
  --r-pill: 6px;
  --r-code: 3px;
  --foto-h: 160px;
}
.intro h1, h2.sec, .facts dd, .card h3, .country h2 { font-stretch: semi-condensed; }
.facts dd { font-variant-numeric: tabular-nums; }
.brand b { font-size: 19px; letter-spacing: .16em; text-transform: uppercase; }
.intro h1 em { font-style: normal; }
.map { background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 50px 50px; background-position: -1px -1px; }
.card .stamp { border-style: solid; border-radius: 3px; transform: none; width: 40px; height: 26px; }
  </style>
</head>
<body data-foto="pruh" data-obr="1" data-pismo="Bahnschrift + Segoe UI Variable">
