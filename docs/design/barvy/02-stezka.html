/* Pobřežní stezka: Šalvějová zeleň porostu nad útesy, písek a mořská modrá pro zahraničí.
   Písmo: Constantia + Corbel. */
:root {
  --paper: #F1F1E8;
  --card: #FAFAF4;
  --ink: #1E2A21;
  --ink-2: #3E4C41;
  --muted: #58655A;
  --line: #D4D6C6;
  --line-2: #E3E5D8;
  --land: #E1E1D3;
  --cz: #4A7B3B;
  --cz-text: #3F6B32;
  --abroad: #2D78A8;
  --q1: #D0E1C3;
  --q2: #A7C793;
  --q3: #76A564;
  --q4: #4A7B3B;
  --q5: #2B4F22;
  --q-ink: #142410;
  --hover: rgba(30, 42, 33, .06);
  --track: #E7E8DA;
  --grid: #E0E1D2;
  --grid-base: #B5B8A2;
  --serif: Constantia, "Sitka Text", Georgia, serif;
  --sans: Corbel, "Segoe UI", system-ui, sans-serif;
  --r-panel: 14px;
  --r-card: 14px;
}
body { font-size: 16px; }
.card .stamp { border-style: solid; border-color: var(--cz); color: var(--cz-text); }
  </style>
