<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Návrh 5 – Noční data · Cestovní stopa</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0F1115; --surface: #16191F; --raise: #1C2028; --line: #262B34; --ink: #ECEDEE; --ink-2: #C3C7CE; --muted: #8F96A3;
  --cz: #3987e5; --abroad: #d95926;
  --h1: #184f95; --h2: #2a78d6; --h3: #6da7ec; --h4: #b7d3f6;
  --land: #1D2129; --land-line: #2A2F38; --visited: #263142;
  --num: "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
a { color: var(--h3); }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 28px; }
.top { display: flex; align-items: center; gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.brand { font: 600 15px var(--mono); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; color: var(--ink); }
.brand::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--abroad); margin-right: 10px; vertical-align: 1px; }
.top nav { display: flex; gap: 2px; }
.top nav a { color: var(--muted); text-decoration: none; font: 13px var(--mono); padding: 8px 12px; border-radius: 6px; }
.top nav a:hover { color: var(--ink); background: var(--raise); }
.top nav a[aria-current="page"] { color: var(--ink); background: var(--raise); }
.top .asof { margin-left: auto; font: 12px var(--mono); color: var(--muted); }

.label { font: 12px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.hero { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-bottom: 1px solid var(--line); }
.hero div { padding: 26px 22px 22px 0; }
.hero div + div { padding-left: 22px; border-left: 1px solid var(--line); }
.hero b { display: block; font: 600 88px/0.95 var(--num); font-stretch: 75%; letter-spacing: -1px; margin-top: 6px; }
.hero small { display: block; font: 12px var(--mono); color: var(--muted); margin-top: 8px; }

.row { display: grid; gap: 20px; margin-top: 20px; }
.r1 { grid-template-columns: minmax(0, 5fr) minmax(0, 2fr); }
.r2 { grid-template-columns: minmax(0, 4fr) minmax(0, 3fr); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.box h2 { font: 600 15px var(--sans); margin: 0; }
.bh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.key { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px var(--mono); color: var(--ink-2); }
.key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.key .c { border-radius: 50%; }
.note { font: 12px var(--mono); color: var(--muted); margin: 10px 0 0; }

.map svg { display: block; width: 100%; height: auto; }
.vz-land { fill: var(--land); stroke: var(--land-line); stroke-width: .6; vector-effect: non-scaling-stroke; }
.vz-visited { stroke: #3A4352; stroke-width: .8; vector-effect: non-scaling-stroke; cursor: pointer; }
.vz-visited:hover, .vz-visited:focus-visible { stroke: var(--ink-2); outline: none; }
.vz-place { fill: var(--cz); stroke: var(--surface); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.vz-place.is-region { fill: none; stroke: var(--cz); stroke-dasharray: 3 2; stroke-width: 1.5; }

.clist { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; }
.clist li { display: grid; grid-template-columns: 34px 1fr 30px; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--line); }
.clist .cc { font: 12px var(--mono); color: var(--muted); }
.clist .nm { font-size: 13px; }
.clist .bar { grid-column: 2; height: 4px; border-radius: 0 2px 2px 0; background: var(--abroad); margin-top: 2px; }
.clist .bar.cz { background: var(--cz); }
.clist .n { font: 600 14px var(--num); text-align: right; grid-row: 1 / span 2; grid-column: 3; }

.heat-scroll { overflow-x: auto; }
.heat { border-collapse: separate; border-spacing: 3px; font: 11px var(--mono); width: 100%; min-width: 460px; }
.heat th { color: var(--muted); font-weight: 400; padding: 0 4px; }
.heat th.y { text-align: right; padding-right: 8px; }
.heat td { min-width: 22px; height: 18px; border-radius: 4px; background: transparent; box-shadow: inset 0 0 0 1px #20242C; padding: 0; text-align: center; color: #0B0D10; font-weight: 700; }
.heat td.v { box-shadow: none; cursor: default; }
.heat td.sep, .heat th.sep { width: 10px; box-shadow: none; }
.heat tr.unkrow th { color: var(--ink-2); }
.heat tr.decade td, .heat tr.decade th { border-top: 0; }
.ramp { display: inline-flex; gap: 3px; vertical-align: -2px; margin: 0 6px; }
.ramp i { width: 14px; height: 10px; border-radius: 3px; margin: 0; }

.vz-chart { display: block; }
.vz-grid { stroke: #232831; }
.vz-grid.is-base { stroke: #3A404B; }
.vz-tick { fill: var(--muted); font: 11px var(--mono); }
.vz-hit { fill: transparent; }
.vz-hit:hover { fill: rgba(255,255,255,.04); }
.hist { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 150px; margin-top: 4px; }
.hist div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.hist span.b { width: 70%; background: var(--h2); border-radius: 4px 4px 0 0; min-height: 2px; }
.hist span.b.unk { background: repeating-linear-gradient(45deg, #3A404B 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px #3A404B; }
.hist b { font: 600 16px var(--num); }
.hist small { font: 11px var(--mono); color: var(--muted); }
footer { font: 12px var(--mono); color: var(--muted); padding: 26px 0 44px; display: grid; gap: 4px; }
.vz-tip { position: fixed; z-index: 20; pointer-events: none; background: #ECEDEE; color: #0F1115; font: 12px/1.45 var(--sans); padding: 7px 9px; border-radius: 6px; max-width: 280px; display: none; }

@media (max-width: 1100px) {
  .r1, .r2 { grid-template-columns: 1fr; }
  .hero { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero div:nth-child(3) { padding-left: 0; border-left: 0; }
  .hero div:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 640px) {
  .wrap { padding: 0 14px; }
  .top { flex-wrap: wrap; gap: 8px; }
  .top nav { order: 3; width: 100%; overflow-x: auto; }
  .hero b { font-size: 60px; }
  .hero div, .hero div + div { padding: 16px 12px 14px 0; }
  .hero div:nth-child(even) { padding-left: 12px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#">Cestovní stopa</a>
    <nav aria-label="Hlavní navigace"><a href="#" aria-current="page">přehled</a><a href="#">mapa</a><a href="#">cesty</a><a href="#">statistiky</a></nav>
    <span class="asof" id="asof"></span>
  </header>

  <section class="hero" id="hero" aria-label="Souhrn"></section>

  <div class="row r1">
    <section class="box">
      <div class="bh"><h2>Místa</h2><div class="key"><span><i class="c" style="background:var(--cz)"></i>místo (velikost = počet cest)</span><span><i class="c" style="border:1.5px dashed var(--cz)"></i>oblast</span><span>body ilustrační</span></div></div>
      <div class="map" id="map"></div>
    </section>
    <section class="box">
      <div class="bh"><h2>Státy</h2><span class="label">cesty</span></div>
      <ul class="clist" id="clist"></ul>
    </section>
  </div>

  <div class="row r2">
    <section class="box">
      <div class="bh"><h2>Rok × měsíc začátku cesty</h2><div class="key">počet cest <span class="ramp"><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i></span> 1 → 4+</div></div>
      <div class="heat-scroll"><table class="heat" id="heat"></table></div>
      <p class="note" id="heatNote"></p>
    </section>
    <div style="display:grid;gap:20px;min-width:0">
      <section class="box">
        <div class="bh"><h2>Česko ↑ · zahraničí ↓</h2><div class="key"><span><i style="background:var(--cz)"></i>Česko</span><span><i style="background:var(--abroad)"></i>zahraničí</span></div></div>
        <div id="mirror"></div>
      </section>
      <section class="box">
        <div class="bh"><h2>Délka pobytu</h2><span class="label">počet cest</span></div>
        <div class="hist" id="hist"></div>
        <p class="note" id="histNote"></p>
      </section>
    </div>
  </div>

  <footer id="foot"></footer>
</div>

<script src="assets/data.js"></script>
<script src="assets/europe-map.js"></script>
<script src="assets/viz.js"></script>
<script>
(function () {
  var F = VZ.fmt, s = VZ.stats(VZ.data.trips), places = VZ.places(VZ.data.trips), $ = function (id) { return document.getElementById(id); };
  var css = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
  var asof = VZ.data.dataAsOf.split('-').reverse().map(Number).join('. ');
  $('asof').textContent = 'data k ' + asof;

  $('hero').innerHTML = [
    ['cest', s.total, s.cz + ' Česko · ' + s.abroad + ' zahraničí'],
    ['států', s.countryCount, s.abroadCountryCount + ' zahraničních'],
    ['nocí', F.num(s.nightsSum), 'známo u ' + s.nightsKnown + '/' + s.total + ' cest'],
    ['let', s.maxYear - s.minYear + 1, s.minYear + '–' + s.maxYear + ' · ' + s.undated + ' cesty bez roku']
  ].map(function (h) { return '<div><span class="label">' + h[0] + '</span><b>' + h[1] + '</b><small>' + h[2] + '</small></div>'; }).join('');

  // mapa: tmavá pevnina, navštívené státy jen jemně, důraz na body
  var cmap = {};
  s.countries.forEach(function (c) { cmap[c.code] = c; });
  VZ.renderMap($('map'), s, {
    label: 'Mapa míst',
    crop: [60, 120, 880, 640],
    fill: function (k) { return cmap[k] ? css('--visited') : null; },
    places: places,
    placeR: function (p) { return 3.5 + Math.sqrt(p.trips.length) * 2.4; }
  });

  var maxC = s.countries[0].count;
  $('clist').innerHTML = s.countries.map(function (c) {
    return '<li><span class="cc">' + c.code + '</span><span class="nm">' + c.name + '</span><span class="n">' + c.count + '</span>' +
      '<span class="bar' + (c.code === 'CZ' ? ' cz' : '') + '" style="width:' + (c.count / maxC * 100).toFixed(1) + '%"></span></li>';
  }).join('');

  // heatmapa rok × měsíc
  var H = [null, '--h1', '--h2', '--h3', '--h4'];
  var cell = function (trips, key) {
    var n = trips.length;
    if (!n) return '<td></td>';
    return '<td class="v" style="background:' + css(H[Math.min(4, n)]) + (n === 2 ? ';color:#fff' : '') + '" data-tip data-k="' + key + '" tabindex="0">' + (n > 1 ? n : '') + '</td>';
  };
  var groups = {};
  var head = '<thead><tr><th></th>' + VZ.MONTHS_SHORT.map(function (m, i) { return '<th title="' + VZ.MONTHS[i] + '">' + (i + 1) + '</th>'; }).join('') + '<th class="sep"></th><th title="měsíc neznámý">?</th></tr></thead>';
  var body = s.years.slice().reverse().map(function (y) {
    var tds = '';
    for (var m = 1; m <= 12; m++) {
      var k = y.year + '-' + m;
      groups[k] = y.trips.filter(function (t) { return t.mesic === m; });
      tds += cell(groups[k], k);
    }
    groups[y.year + '-?'] = y.trips.filter(function (t) { return !t.mesic; });
    return '<tr><th class="y">' + y.year + '</th>' + tds + '<td class="sep"></td>' + cell(groups[y.year + '-?'], y.year + '-?') + '</tr>';
  }).join('');
  groups['?-?'] = s.undatedTrips;
  body += '<tr class="unkrow"><th class="y">rok ?</th>' + new Array(13).join('<td></td>') + '<td class="sep"></td>' + cell(s.undatedTrips, '?-?') + '</tr>';
  $('heat').innerHTML = head + '<tbody>' + body + '</tbody>';
  VZ.bindTips($('heat'), function (t) {
    var k = t.dataset.k, p = k.split('-'), tr = groups[k];
    var when = p[0] === '?' ? 'Rok neznámý' : p[1] === '?' ? p[0] + ', měsíc neznámý' : VZ.MONTHS[+p[1] - 1] + ' ' + p[0];
    return '<b>' + when + '</b> · ' + F.cesty(tr.length) + '<br>' + tr.map(function (x) { return F.esc(x.nazev); }).join('<br>');
  });
  var monthUnknown = s.total - s.monthsKnown;
  $('heatNote').textContent = 'Sloupec ? = známý rok, neznámý měsíc (' + (monthUnknown - s.undated) + ' cest). Řádek „rok ?“ = ' + F.cesty(s.undated) + ' bez roku.';

  VZ.yearsChart($('mirror'), s, { height: 280, mirrored: true, colors: { cz: css('--cz'), abroad: css('--abroad') } });

  var maxB = Math.max.apply(null, s.buckets.map(function (b) { return b.count; }).concat([s.nightsUnknown]));
  $('hist').innerHTML = s.buckets.map(function (b) {
    return '<div><b>' + b.count + '</b><span class="b" style="height:' + (b.count / maxB * 100).toFixed(1) + '%"></span><small>' + b.label + '</small></div>';
  }).join('') + '<div><b>' + s.nightsUnknown + '</b><span class="b unk" style="height:' + (s.nightsUnknown / maxB * 100).toFixed(1) + '%"></span><small>?</small></div>';
  $('histNote').textContent = 'Počet nocí · medián ' + F.noci(s.median) + ' · průměr ' + F.num(s.mean, 1) + ' (jen ze známých délek)';

  $('foot').innerHTML = '<span>// hlavní země cesty se počítá jednou; průjezd není návštěva</span><span>// neznámé hodnoty = „?“, nikdy 0</span><span>// body míst v maketě jsou ilustrační, nejde o ověřený číselník</span><span>// data k ' + asof + '</span>';
})();
</script>
</body>
</html>
