<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Přehled · Cestovní atlas</title>
  <meta name="description" content="Osobní archiv uskutečněných cest: mapa navštívených států, poslední cesty a přehled po letech.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="cs_CZ">
  <meta property="og:site_name" content="Cestovní atlas">
  <meta property="og:title" content="Přehled · Cestovní atlas">
  <meta property="og:description" content="Osobní archiv uskutečněných cest: mapa navštívených států, poslední cesty a přehled po letech.">
  <meta property="og:image" content="/src/img/sdileni.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Skalnaté útesy nad oceánem s malou písečnou pláží">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f2eadb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/src/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/atlas.css">
  <script type="module" src="/src/pages/prehled.ts"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="./"><b>Cestovní atlas</b></a>
      <nav aria-label="Hlavní navigace">
        <a href="./" aria-current="page">Přehled</a>
        <a href="kronika.html">Kronika</a>
        <a href="statistiky.html">Statistiky</a>
      </nav>
    </header>
    <main id="main">
      <noscript><p class="empty-note">Atlas zobrazuje data pomocí JavaScriptu. Zapněte ho prosím v prohlížeči.</p></noscript>
      <section class="hero">
        <div class="panel map-card">
          <div class="map-toolbar">
            <button type="button" class="zoom-out" id="zoomOut" hidden>← Celá Evropa</button>
            <div class="seg" id="layers" role="group" aria-label="Vrstva mapy" hidden>
              <button type="button" data-layer="countries" aria-pressed="true">Státy</button>
              <button type="button" data-layer="places" aria-pressed="false">Místa</button>
            </div>
            <span class="note" id="mapNote"></span>
          </div>
          <div class="map" id="map"></div>
          <div class="legend" id="legend"></div>
        </div>
        <div class="intro">
          <div class="intro-top">
            <figure class="foto"><img src="/src/img/pobrezi.jpg" width="480" height="270" alt="Skalnaté útesy nad oceánem s malou písečnou pláží"></figure>
            <p class="kicker" id="span"></p>
            <h1 id="headline">Přehled</h1>
          </div>
          <div class="flagrow" id="flagrow" role="group" aria-label="Navštívené státy podle počtu cest"></div>
          <dl class="facts" id="facts"></dl>
          <article class="panel country" id="country" aria-live="polite"></article>
        </div>
      </section>

      <section class="recent">
        <div class="sec-head"><h2 class="sec">Poslední cesty</h2><a class="link" href="kronika.html">Celá kronika →</a></div>
        <div class="cards" id="recent"></div>
      </section>
    </main>
  </div>
</body>
</html>
